{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – MoneyMate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(16, 185, 129, 0.08) 0%, var(--bg-app) 70%);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="{% url 'landing' %}" class="brand-link" style="justify-content: center; margin-bottom: 1rem; color: var(--text-main);">
        <div class="brand-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <span style="font-weight: 800; font-size: 1.4rem;">MoneyMate</span>
      </a>
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem;">Welcome Back</h2>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Enter your credentials to access your financial dashboard.</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          <i class="fa-solid fa-circle-exclamation"></i>
          <div>{{ message }}</div>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">Username</label>
        <div style="position: relative;">
          <input type="text" name="username" class="form-input" style="padding-left: 2.4rem;" placeholder="Enter your username" required autofocus>
          <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" class="form-input" style="padding-left: 2.4rem;" placeholder="Enter your password" required>
          <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create free account</a>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
      <a href="{% url 'landing' %}" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
